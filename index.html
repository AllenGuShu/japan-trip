<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>旅遊紀錄手冊</title>
<meta name="theme-color" content="#0B6E4F" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-32.png" sizes="32x32" />
<link rel="icon" href="icons/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="旅遊手冊" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ===================== 首頁：旅遊列表 ===================== -->
<div id="screen-home" class="screen active">
  <header class="route-header">
    <div class="route-header__top">
      <span class="route-badge">📖 JOURNAL</span>
      <div class="header-right">
        <span id="tripCount" class="countdown">0 趟旅程</span>
        <button class="icon-btn theme-toggle-btn" title="深色模式">🌙</button>
        <button id="openGlobalSettings" class="icon-btn" title="地點搜尋設定">🔑</button>
      </div>
    </div>
    <h1 class="route-title">旅遊紀錄手冊</h1>
    <div class="route-sub"><span>每一趟旅程都留一份路線紀錄</span></div>
  </header>

  <main class="home-main">
    <div class="home-actions">
      <button class="btn btn--primary btn--block" data-open="trip-form">＋ 新增一趟旅遊</button>
      <button class="btn btn--ghost btn--block" id="importTripBtn">📥 匯入旅遊檔案</button>
    </div>
    <div id="tripList" class="stack trip-list"></div>
  </main>
</div>

<!-- ===================== 單趟旅遊內頁 ===================== -->
<div id="screen-trip" class="screen">
  <header class="route-header">
    <div class="route-header__top">
      <button id="backHome" class="back-btn">← 回手冊</button>
      <div class="header-right">
        <span id="countdown" class="countdown">-- 天後出發</span>
        <button class="icon-btn theme-toggle-btn" title="深色模式">🌙</button>
        <button id="openSettings" class="icon-btn" title="旅遊設定">⚙️</button>
      </div>
    </div>
    <h1 id="tripTitle" class="route-title" contenteditable="true" spellcheck="false">日本自駕旅遊</h1>
    <div class="route-sub">
      <span id="tripDaysLabel">6天5夜・自駕</span>
      <span class="dot">・</span>
      <span id="tripDateRange" contenteditable="true" spellcheck="false">點此設定日期</span>
    </div>
  </header>

  <main id="views">

    <!-- 景點 -->
    <section id="view-spots" class="view">
      <div class="view-head">
        <h2>景點清單</h2>
        <button class="btn btn--primary" data-open="spot-form">＋ 新增景點</button>
      </div>
      <div class="filter-row" id="spotFilters"></div>
      <div class="filter-row" id="spotTagFilters"></div>
      <div id="spotList" class="stack"></div>
    </section>

    <!-- 行程 -->
    <section id="view-days" class="view active">
      <div class="view-head">
        <h2>每日行程</h2>
      </div>
      <div class="filter-row" id="itineraryModeBar"></div>
      <div class="day-tabs" id="dayTabs"></div>
      <div id="dayRoad" class="road"></div>
    </section>

    <!-- 交通住宿 -->
    <section id="view-logistics" class="view">
      <div class="view-head">
        <h2>交通住宿</h2>
      </div>
      <div class="day-tabs" id="logisticsSubTabs"></div>
      <div id="logisticsContent" class="stack"></div>
    </section>

    <!-- 準備清單 -->
    <section id="view-packing" class="view">
      <div class="view-head">
        <h2>行前準備清單</h2>
        <span class="progress-pill" id="packingProgress">0/0</span>
      </div>
      <div id="packingList" class="stack"></div>
      <button class="btn btn--ghost" data-open="packing-form">＋ 新增項目</button>
    </section>

    <!-- 記帳 -->
    <section id="view-expenses" class="view">
      <div class="view-head">
        <h2>旅費記帳</h2>
      </div>
      <div class="expense-summary">
        <div class="expense-total">
          <span class="label">總支出</span>
          <span class="value"><span id="totalJPY">¥0</span></span>
          <span class="value-sub">約 <span id="totalTWD">NT$0</span></span>
        </div>
        <label class="rate-input">
          匯率 1 <span id="rateFromCode">JPY</span> =
          <input type="number" id="exRate" step="0.0001" />
          TWD
        </label>
        <button class="btn btn--small rate-fetch-btn" id="fetchRateBtn">📡 抓即時匯率</button>
        <span id="rateStatus" class="rate-status"></span>
      </div>
      <div id="budgetSection"></div>
      <div id="expenseByCategory" class="chip-row"></div>
      <div id="expenseList" class="stack"></div>
      <button class="btn btn--primary" data-open="expense-form">＋ 新增花費</button>
    </section>

    <!-- 會話 -->
    <section id="view-phrases" class="view">
      <div class="view-head">
        <h2>開車 / 旅遊會話小抄</h2>
      </div>
      <div class="filter-row" id="phraseFilters"></div>
      <div id="phraseList" class="stack"></div>
      <button class="btn btn--ghost" data-open="phrase-form">＋ 新增自訂例句</button>
    </section>

    <!-- 注意事項 -->
    <section id="view-notes" class="view">
      <div class="view-head">
        <h2>注意事項</h2>
      </div>
      <div id="noteList" class="stack"></div>
      <button class="btn btn--ghost" data-open="note-form">＋ 新增提醒</button>
    </section>

    <!-- 旅遊設定 -->
    <section id="view-settings" class="view">
      <div class="view-head">
        <h2>旅遊設定</h2>
      </div>
      <div id="settingsFields"></div>
      <div class="card" style="margin-top:16px;">
        <button class="btn btn--danger btn--block" id="deleteTripBtn">🗑 刪除這趟旅遊</button>
      </div>
    </section>

  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tabbar__btn" data-view="logistics"><span class="ico">🛫</span><span>交通住宿</span></button>
    <button class="tabbar__btn active" data-view="days"><span class="ico">🛣️</span><span>行程</span></button>
    <button class="tabbar__btn" data-view="spots"><span class="ico">📍</span><span>景點</span></button>
    <button class="tabbar__btn" data-view="packing"><span class="ico">🧳</span><span>準備</span></button>
    <button class="tabbar__btn" data-view="expenses"><span class="ico">💰</span><span>記帳</span></button>
    <button class="tabbar__btn" data-view="phrases"><span class="ico">💬</span><span>會話</span></button>
    <button class="tabbar__btn" data-view="notes"><span class="ico">⚠️</span><span>提醒</span></button>
  </nav>
</div>

<!-- Modal host -->
<div id="modalRoot" class="modal-root"></div>

<!-- 安裝提示橫幅 -->
<div id="installBanner" class="install-banner" hidden>
  <span class="install-banner__icon">📲</span>
  <div class="install-banner__text">
    <p id="installBannerTitle">把手冊加到主畫面</p>
    <p id="installBannerSub" class="install-banner__sub">像 App 一樣全螢幕使用，離線也能查看</p>
  </div>
  <button id="installBannerAction" class="btn btn--small btn--primary" hidden>安裝</button>
  <button id="installBannerClose" class="install-banner__close" title="關閉">✕</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="app.js"></script>
</body>
</html>
